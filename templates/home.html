{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-3">{{ _("Sign in") }}</h3>
      <form method="post" action="{{ url_for('home') }}">
        <div class="mb-3">
          <label class="form-label">{{ _("Username") }}</label>
          <input class="form-control" name="username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ _("Password") }}</label>
          <input class="form-control" type="password" name="password" required>
        </div>
        <button class="btn btn-wc w-100" type="submit">{{ _("Log in") }}</button>
      </form>
      <p class="mt-3 mb-0 text-center">
        {{ _("Need an account?") }}
        <a href="{{ url_for('register') }}">{{ _("Register") }}</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
